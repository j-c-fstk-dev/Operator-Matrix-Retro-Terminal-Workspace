# Site da landing page. No Netlify: Base directory = landing
[build]
  command = "node build-config.mjs"
  publish = "."

# Navegador em português na raiz: vai para /pt/. O seletor EN/PT grava o cookie
# nf_lang, que o Netlify usa no lugar do idioma do navegador.
[[redirects]]
  from = "/"
  to = "/pt/"
  status = 302
  force = true
  conditions = { Language = ["pt"] }

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self' https://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
