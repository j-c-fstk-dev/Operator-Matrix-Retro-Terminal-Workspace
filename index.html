    <script>
      // Guard against third-party extension injection errors (e.g. MetaMask / Web3 wallets)
      window.addEventListener('unhandledrejection', function(event) {
        var reason = (event && event.reason && (event.reason.message || event.reason)) || '';
        if (typeof reason === 'string' && /metamask|ethereum|web3|wallet/i.test(reason)) {
          event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = (event && event.message) || '';
        if (typeof msg === 'string' && /metamask|ethereum|web3|wallet/i.test(msg)) {
          event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
        }
      });
    </script>
